[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-trace-canary"
version = "0.1.1"
description = "Offline synthetic-canary regression tests for AI agent telemetry"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Owen Crabbe" }]
keywords = ["ai-agents", "privacy", "telemetry", "testing", "opentelemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-cov==7.0.0", "build==1.3.0"]
openai = ["openai-agents==0.22.3"]
pydantic = ["pydantic-ai-slim==2.52.0", "opentelemetry-sdk==1.44.0"]
integrations = [
  "openai-agents==0.22.3",
  "pydantic-ai-slim==2.52.0",
  "opentelemetry-sdk==1.44.0",
]

[project.scripts]
agent-trace-canary = "agent_trace_canary.cli:main"

[project.urls]
Homepage = "https://github.com/owencrabbe/agent-trace-canary"
Repository = "https://github.com/owencrabbe/agent-trace-canary"
Issues = "https://github.com/owencrabbe/agent-trace-canary/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace_canary"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: exercises a third-party SDK entirely offline"]
